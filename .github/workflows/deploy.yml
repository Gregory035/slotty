name: Deploy production

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/api/Dockerfile
          target: release
          push: true
          tags: ghcr.io/${{ github.repository }}/api-release:${{ github.sha }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/web/Dockerfile
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy, migrate, check readiness and rollback on failure
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$VPS_USER@$VPS_HOST" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          scp docker-compose.production.yml docker-compose.deploy.yml "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/"
          scp scripts/deploy.sh "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/scripts/deploy.sh"
          ssh "$VPS_USER@$VPS_HOST" "cd '$VPS_APP_DIR' && GHCR_REPOSITORY='${{ github.repository }}' IMAGE_TAG='${{ github.sha }}' PUBLIC_HEALTH_URL='$PUBLIC_HEALTH_URL' sh scripts/deploy.sh"
