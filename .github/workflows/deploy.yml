name: Deploy production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize container repository
        id: images
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Validate public SEO origin
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: node -e "const u=new URL(process.env.WEB_URL); if(u.protocol!=='https:' || u.origin!==process.env.WEB_URL || /(^|\.)localhost$|example\./.test(u.hostname)) process.exit(1)"
      - name: Validate production analytics configuration
        env:
          VITE_YM_COUNTER_ID: ${{ vars.VITE_YM_COUNTER_ID }}
        run: node -e "if (!/^[1-9][0-9]*$/.test(process.env.VITE_YM_COUNTER_ID || '')) { console.error('Set VITE_YM_COUNTER_ID to the existing Slotty counter before publishing'); process.exit(1); }"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ops/backup/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.images.outputs.repository }}/backup:${{ env.DEPLOY_SHA }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          tags: ghcr.io/${{ steps.images.outputs.repository }}/api:${{ env.DEPLOY_SHA }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/api/Dockerfile
          target: release
          push: true
          tags: ghcr.io/${{ steps.images.outputs.repository }}/api-release:${{ env.DEPLOY_SHA }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/web/Dockerfile
          target: runtime
          push: true
          tags: ghcr.io/${{ steps.images.outputs.repository }}/web:${{ env.DEPLOY_SHA }}
          build-args: |
            VITE_SITE_URL=${{ vars.WEB_URL }}
            VITE_GA_MEASUREMENT_ID=${{ vars.VITE_GA_MEASUREMENT_ID }}
            VITE_YM_COUNTER_ID=${{ vars.VITE_YM_COUNTER_ID }}
            SEO_INDEXING_ENABLED=true
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy, migrate, check readiness and rollback on failure
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$VPS_USER@$VPS_HOST" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          scp docker-compose.production.yml docker-compose.deploy.yml "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/"
          scp scripts/deploy.sh scripts/backup.sh "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/scripts/"
          ssh "$VPS_USER@$VPS_HOST" "cd '$VPS_APP_DIR' && GHCR_REPOSITORY='${{ steps.images.outputs.repository }}' IMAGE_TAG='$DEPLOY_SHA' PUBLIC_HEALTH_URL='$PUBLIC_HEALTH_URL' sh scripts/deploy.sh"
