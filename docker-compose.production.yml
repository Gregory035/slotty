services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegram_business}
      POSTGRES_USER: ${POSTGRES_USER:-telegram_business}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backup:
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-telegram_business}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-telegram_business}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_CONFIG_BASE64: ${RCLONE_CONFIG_BASE64:-}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: release
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-telegram_business}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-telegram_business}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      API_PUBLIC_URL: ${API_PUBLIC_URL:?API_PUBLIC_URL is required}
      TELEGRAM_API_ROOT: ${TELEGRAM_API_ROOT:-}
      TELEGRAM_USE_ENV_PROXY: ${TELEGRAM_USE_ENV_PROXY:-false}
      NODE_OPTIONS: ${NODE_OPTIONS:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost,postgres,redis,web}
      WEB_URL: ${WEB_URL:?WEB_URL is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-telegram_business}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-telegram_business}?schema=public
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_FAIL_OPEN: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      BOT_TOKEN_ENCRYPTION_KEY: ${BOT_TOKEN_ENCRYPTION_KEY:?BOT_TOKEN_ENCRYPTION_KEY is required}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      ERROR_TRACKING_URL: ${ERROR_TRACKING_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-}
      PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PASSWORD_RESET_FROM_EMAIL: ${PASSWORD_RESET_FROM_EMAIL:-}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      COMPANY_INVITATION_TTL_HOURS: ${COMPANY_INVITATION_TTL_HOURS:-72}
      RATE_LIMIT_INVITATION_MAX: ${RATE_LIMIT_INVITATION_MAX:-30}
      RATE_LIMIT_INVITATION_WINDOW_SECONDS: ${RATE_LIMIT_INVITATION_WINDOW_SECONDS:-60}
      RATE_LIMIT_INVITATION_REGISTER_MAX: ${RATE_LIMIT_INVITATION_REGISTER_MAX:-5}
      RATE_LIMIT_INVITATION_REGISTER_WINDOW_SECONDS: ${RATE_LIMIT_INVITATION_REGISTER_WINDOW_SECONDS:-3600}
      RATE_LIMIT_INVITATION_ACCEPT_MAX: ${RATE_LIMIT_INVITATION_ACCEPT_MAX:-10}
      RATE_LIMIT_INVITATION_ACCEPT_WINDOW_SECONDS: ${RATE_LIMIT_INVITATION_ACCEPT_WINDOW_SECONDS:-3600}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      WORK_EXAMPLES_DIR: /data/work-examples
      WORK_EXAMPLES_STORAGE: ${WORK_EXAMPLES_STORAGE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      BACKUP_STATUS_FILE: /backups/latest-status.json
      BACKUP_REMOTE_CONFIGURED: ${BACKUP_REMOTE_CONFIGURED:-false}
    volumes:
      - work_examples:/data/work-examples
      - ${BACKUP_HOST_DIR:-./backups}:/backups:ro
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SITE_URL: ${WEB_URL:?WEB_URL is required}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
        VITE_YM_COUNTER_ID: ${VITE_YM_COUNTER_ID:-}
        SEO_INDEXING_ENABLED: ${SEO_INDEXING_ENABLED:?SEO_INDEXING_ENABLED must be true or false}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  work_examples:
