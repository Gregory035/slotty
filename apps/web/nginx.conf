server {
  listen 8080;
  server_name _;
  server_tokens off;
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://mc.yandex.ru; img-src 'self' data: https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' https://www.googletagmanager.com https://mc.yandex.ru; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  error_page 404 /404.html;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location = / { try_files /index.html =404; }
  location = /online-zapis { try_files /online-zapis/index.html =404; }
  location = /zapis-cherez-telegram { try_files /zapis-cherez-telegram/index.html =404; }

  location = /online-zapis/ { return 308 /online-zapis$is_args$args; }
  location = /zapis-cherez-telegram/ { return 308 /zapis-cherez-telegram$is_args$args; }
  location = /app/ { return 308 /app$is_args$args; }

  location = /app {
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /private.html =404;
  }

  location ~ ^/companies/[^/]+/[^/]+$ {
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /private.html =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location = /private.html {
    internal;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location = /404.html {
    internal;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location = /robots.txt { add_header Cache-Control "public, max-age=3600" always; }
  location = /sitemap.xml { add_header Cache-Control "public, max-age=3600" always; }

  location ~* \.(?:js|css|woff2|png|webp|avif|svg|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / { try_files $uri $uri/ =404; }
}
