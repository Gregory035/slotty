# Keep all add_header directives at server level: a location-level add_header
# replaces the complete inherited set on Nginx 1.27.
map $uri $slotty_cache_control {
  default "";
  /index.html "no-cache";
  /private.html "no-store";
  /404.html "no-store";
  /app "no-store";
  ~^/companies/[^/]+/[^/]+$ "no-store";
  ~^/miniapp/[0-9a-fA-F-]+$ "no-store";
  ~^/company/[a-z0-9-]+$ "no-store";
  /robots.txt "public, max-age=3600";
  /sitemap.xml "public, max-age=3600";
  /sw.js "no-cache";
  /site.webmanifest "public, max-age=3600";
  ~*\.(?:js|css|woff2|png|webp|avif|svg|ico)$ "public, max-age=31536000, immutable";
}

map $slotty_cache_control $slotty_robots {
  default "";
  "no-store" "noindex, nofollow";
}

map $request_uri $slotty_frame_ancestors {
  default "'self'";
  ~^/miniapp/[0-9a-fA-F-]+(?:/|\?|$) "'self' https://web.telegram.org";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://mc.yandex.ru; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' https://www.googletagmanager.com https://mc.yandex.ru https://telegram.org; frame-ancestors $slotty_frame_ancestors; base-uri 'self'; form-action 'self'" always;
  add_header Cache-Control $slotty_cache_control always;
  add_header X-Robots-Tag $slotty_robots always;

  error_page 404 /404.html;

  location /api/ {
    # Multipart overhead must fit above the API's 5 MiB image-file limit.
    client_max_body_size 6m;
    error_page 413 = @upload_too_large;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Caddy discards incoming spoofed XFF. Append its peer IP, preserving the
    # two-hop chain consumed by API_TRUST_PROXY_HOPS=2 in production Compose.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location @upload_too_large {
    default_type application/json;
    return 413 '{"statusCode":413,"message":"Файл слишком большой. Выберите изображение до 5 МБ."}';
  }

  location = / { try_files /index.html =404; }
  location = /online-zapis { try_files /online-zapis/index.html =404; }
  location = /zapis-cherez-telegram { try_files /zapis-cherez-telegram/index.html =404; }
  location = /dlya-mastera { try_files /dlya-mastera/index.html =404; }
  location = /dlya-salona { try_files /dlya-salona/index.html =404; }
  location = /privacy { try_files /privacy/index.html =404; }
  location = /terms { try_files /terms/index.html =404; }
  location = /personal-data { try_files /personal-data/index.html =404; }
  location = /offer { try_files /offer/index.html =404; }
  location = /cookies { try_files /cookies/index.html =404; }
  location = /data-processing { try_files /data-processing/index.html =404; }

  location = /online-zapis/ { return 308 /online-zapis$is_args$args; }
  location = /zapis-cherez-telegram/ { return 308 /zapis-cherez-telegram$is_args$args; }
  location = /dlya-mastera/ { return 308 /dlya-mastera$is_args$args; }
  location = /dlya-salona/ { return 308 /dlya-salona$is_args$args; }
  location = /app/ { return 308 /app$is_args$args; }
  location = /privacy/ { return 308 /privacy$is_args$args; }
  location = /terms/ { return 308 /terms$is_args$args; }
  location = /personal-data/ { return 308 /personal-data$is_args$args; }
  location = /offer/ { return 308 /offer$is_args$args; }
  location = /cookies/ { return 308 /cookies$is_args$args; }
  location = /data-processing/ { return 308 /data-processing$is_args$args; }
  location ~ ^(/company/[a-z0-9-]+)/$ { return 308 $1$is_args$args; }
  location ~ ^(/miniapp/[0-9a-fA-F-]+)/$ { return 308 $1$is_args$args; }

  location = /app {
    default_type text/html;
    try_files /private.html =404;
  }

  location ~ ^/companies/[^/]+/[^/]+$ {
    default_type text/html;
    try_files /private.html =404;
  }

  location ~ ^/miniapp/[0-9a-fA-F-]+$ {
    default_type text/html;
    try_files /private.html =404;
  }

  location ~ ^/company/[a-z0-9-]+$ {
    default_type text/html;
    try_files /private.html =404;
  }

  location = /index.html {
    try_files $uri =404;
  }

  location = /private.html {
    internal;
    default_type text/html;
  }

  location = /404.html {
    internal;
    default_type text/html;
  }

  location = /robots.txt { try_files $uri =404; }
  location = /sitemap.xml { try_files $uri =404; }
  location = /sw.js { try_files $uri =404; }
  location = /site.webmanifest {
    default_type application/manifest+json;
  }

  location ~* \.(?:js|css|woff2|png|webp|avif|svg|ico)$ {
    try_files $uri =404;
  }

  location / { try_files $uri $uri/ =404; }
}
