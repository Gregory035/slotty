    <title>Slotty — онлайн-запись через Telegram для малого бизнеса</title>
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"Slotty","applicationCategory":"BusinessApplication","operatingSystem":"Web","inLanguage":"ru","description":"Онлайн-запись через Telegram, расписание и управление клиентами для малого бизнеса."}</script>
    <script>
      (() => {
        const mode = localStorage.getItem('slotty-theme') || 'system';
        const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#0C0D0B' : '#F5F5F1');
      })();
    </script>
  </head>
  <body>
    <div id="root"><noscript><main><h1>Slotty — онлайн-запись через Telegram для малого бизнеса</h1><p>Расписание, клиенты, команда и запись через Telegram в одной системе.</p></main></noscript></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
